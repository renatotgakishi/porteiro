services:
  postgres:
    image: postgres:17
    container_name: porteiro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-porteiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-porteiro123}
      POSTGRES_DB: ${POSTGRES_DB:-porteiro}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: porteiro-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis-insight:
    image: redis/redisinsight:latest
    container_name: porteiro-redis-insight
    restart: unless-stopped
    ports:
      - '5540:5540'
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redisinsight_data:
